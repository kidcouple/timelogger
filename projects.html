<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📁 프로젝트 관리 — Tacdore.TimeLogger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="supabaseClient.js"></script>
    <style>
        :root {
            --bg: #111318;
            --panel: #1c1f27;
            --border: #2a2d35;
            --primary: #4f8ef7;
            --green: #3fb950;
            --red: #f85149;
            --orange: #f78166;
            --yellow: #e3b341;
            --purple: #a371f7;
            --text: #e6edf3;
            --sub: #8b949e;
        }

        .user-badge {
            background: rgba(79, 142, 247, 0.15);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(79, 142, 247, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-badge:hover {
            background: rgba(79, 142, 247, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .desktop-nav {
            display: flex;
            gap: 20px;
            margin-left: 40px;
        }

        .desktop-nav a {
            color: var(--sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--primary);
        }

        .back {
            color: var(--sub);
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: var(--text);
        }

        .title {
            font-size: 15px;
            font-weight: 700;
        }

        .toolbar {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        button {
            background: #2a2d35;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        button:hover {
            background: #353840;
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }

        .content {
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card-head {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #232731;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
        }

        /* Project List */
        .proj-list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: calc(100vh - 200px);
        }

        .proj-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 18px;
            border-bottom: 1px solid #1e2028;
            transition: background .2s;
        }

        .proj-row:hover {
            background: #1e2230;
        }

        .proj-row-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111318;
            border-radius: 8px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .proj-row-info {
            flex: 1;
            overflow: hidden;
        }

        .proj-row-name {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .proj-row-meta {
            font-size: 11px;
            color: var(--sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .proj-row-stats {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-shrink: 0;
            margin-right: 12px;
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--sub);
        }

        .stat-value {
            font-weight: 600;
        }

        .proj-row-act {
            display: flex;
            gap: 4px;
            opacity: 0.5;
            transition: opacity .2s;
        }

        .proj-row:hover .proj-row-act {
            opacity: 1;
        }

        .empty-list {
            text-align: center;
            padding: 60px;
            color: var(--sub);
        }

        /* Modal Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .modal {
            background: #1c1f27;
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 450px;
            max-width: 95%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .fl {
            font-size: 12px;
            color: var(--sub);
            margin-bottom: 4px;
            display: block;
        }

        .fi {
            width: 100%;
            background: #111318;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .fi:focus {
            border-color: var(--primary);
            outline: none;
        }

        @media (max-width: 768px) {

            header,
            .toolbar,
            .desktop-nav {
                display: none !important;
            }

            .mobile-action-bar {
                display: flex !important;
            }

            .content {
                padding: 12px;
            }

            .proj-row {
                flex-wrap: nowrap;
                padding: 6px 12px;
                gap: 8px;
            }

            .proj-row-icon {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }

            .proj-row-meta {
                display: none;
            }

            .proj-row-stats {
                width: auto;
                margin-top: 0;
                padding-top: 0;
                border-top: none;
                gap: 8px;
                font-size: 11px;
            }

            .stat-item {
                gap: 2px;
            }

            .proj-row-act button {
                padding: 4px 6px;
                font-size: 10px;
            }

            .bottom-nav {
                display: flex !important;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 65px;
                background: #1c1f27;
                border-top: 1px solid var(--border);
                justify-content: space-around;
                align-items: center;
                z-index: 200;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                color: var(--sub);
                text-decoration: none;
                font-size: 10px;
                opacity: 0.7;
            }

            .nav-item.active {
                color: var(--primary);
                opacity: 1;
            }

            .nav-icon {
                font-size: 20px;
            }
        }

        @media (min-width: 769px) {

            .mobile-action-bar,
            .bottom-nav {
                display: none !important;
            }
        }

        .icon-btn {
            font-size: 18px !important;
            padding: 6px 10px !important;
            line-height: 1 !important;
        }
    </style>
</head>

<body>
    <header>
        <a class="back" href="index.html">← 허브</a>
        <div class="title" style="display:flex; align-items:center; gap:8px">
            <a href="index.html" class="brand" style="font-size:20px; font-weight:800; letter-spacing:-0.3px; text-decoration:none; background:linear-gradient(90deg,#6c7bff,#a855f7); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;">Tacdore.TimeLogger</a>
            <div id="userBadge" class="user-badge" onclick="changeUser()">👤 로딩..</div>
        </div>
        <nav class="desktop-nav">
            <a href="index.html">할일목록</a>
            <a href="timer.html">타이머</a>
            <a href="clients.html">고객사</a>
            <a href="projects.html" class="active">프로젝트</a>
        </nav>
        <div class="toolbar">
            <button class="primary" onclick="openModal()">+ 프로젝트 등록</button>
            <button class="icon-btn" onclick="init(true)" title="최신 데이터 다시 불러오기 (새로고침)">🔄</button>
        </div>
    </header>

    <div class="mobile-action-bar"
        style="display:none; padding:10px 16px; background:var(--bg); gap:8px; border-bottom:1px solid var(--border); justify-content: space-between; align-items:center;">
        <div class="title" style="font-size:14px">📁 프로젝트</div>
        <div style="display:flex; gap:8px">
            <button class="primary" onclick="openModal()" style="padding:8px 12px">+ 등록</button>
            <button class="icon-btn" onclick="init(true)" style="background:var(--panel); padding:8px 12px">🔄</button>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <div class="card-head">목록 <span id="cnt" class="badge">0</span></div>
            <div class="proj-list" id="projList"></div>
        </div>
    </div>

    <!-- Registration / Edit Modal -->
    <div id="modalOverlay" class="overlay">
        <div class="modal">
            <div class="modal-head">
                <span id="formTitle">프로젝트 등록</span>
                <button onclick="closeModal()"
                    style="background:none; border:none; font-size:20px; color:var(--sub); cursor:pointer">&times;</button>
            </div>
            <div class="modal-body">
                <div><label class="fl">프로젝트명 *</label><input id="fName" class="fi" placeholder="예) 2025 S/4HANA 전환">
                </div>
                <div>
                    <label class="fl">상태</label>
                    <select id="fStatus" class="fi">
                        <option value="active">🟢 진행중</option>
                        <option value="hold">🟡 보류</option>
                        <option value="done">✅ 완료</option>
                    </select>
                </div>
                <div>
                    <label class="fl">아이콘 (이모지)</label>
                    <input id="fIcon" class="fi" placeholder="📁" maxlength="2" value="📁">
                </div>
                <div><label class="fl">메모</label><textarea id="fMemo" class="fi" rows="3"
                        placeholder="프로젝트 설명"></textarea></div>
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button onclick="closeModal()" style="flex:1">취소</button>
                    <button class="primary" onclick="saveProject()" style="flex:2">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>할일목록</span>
        </a>
        <a href="timer.html" class="nav-item">
            <span class="nav-icon">⏱</span>
            <span>타이머</span>
        </a>
        <a href="clients.html" class="nav-item">
            <span class="nav-icon">🏢</span>
            <span>고객사</span>
        </a>
        <a href="projects.html" class="nav-item active">
            <span class="nav-icon">📁</span>
            <span>프로젝트</span>
        </a>
    </nav>

    <script>
        let projects = [];
        let tasks = [];
        let logs = [];
        let editId = null;

        async function save() {
            try { await supabaseAPI.upsert('projects', projects); } catch (e) { console.error("DB Save failed:", e); }
        }

        function openModal() { resetForm(); document.getElementById('modalOverlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

        function projStats(name) {
            const pt = tasks.filter(t => t.project && t.project.trim().toLowerCase() === name.trim().toLowerCase());
            const done = pt.filter(t => t.status === 'done').length;
            let mins = 0;
            pt.forEach(t => {
                if (t.actualTime) mins += parseFloat(t.actualTime) || 0;
                else {
                    const tid = String(t.id || ''), tseq = t.seq ? String(t.seq) : '';
                    (logs || []).forEach(l => {
                        const ltid = String(l.taskId || '');
                        if (ltid && (ltid === tid || (tseq && ltid === tseq))) {
                            if (l.duration) mins += parseFloat(l.duration) || 0;
                            else if (l.start && l.end) mins += (new Date(l.end) - new Date(l.start)) / 60000;
                        }
                    });
                }
            });
            return { total: pt.length, done, mins: Math.round(mins) };
        }
        const fmt = m => {
            const h = Math.floor(m / 60);
            const min = Math.round(m % 60);
            if (h > 0) return `${h}시간 ${min}분`;
            return `${min}분`;
        };

        function renderList() {
            const el = document.getElementById('projList');
            document.getElementById('cnt').textContent = projects.length;
            if (!projects.length) { el.innerHTML = '<div class="empty-list">📁<br><br>새 프로젝트를 등록하세요.</div>'; return; }

            const statusIcons = { active: '🟢', hold: '🟡', done: '✅' };
            el.innerHTML = projects.map(p => {
                const s = projStats(p.name);
                const sIcon = statusIcons[p.status] || '⚪';
                return `<div class="proj-row">
                    <div class="proj-row-icon">${p.icon || '📁'}</div>
                    <div class="proj-row-info">
                        <div class="proj-row-name">${sIcon} ${p.name}</div>
                        <div class="proj-row-meta" title="${p.memo || ''}">${p.memo || '설명 없음'}</div>
                    </div>
                    <div class="proj-row-stats">
                        <div class="stat-item" title="업무수"><span class="stat-label">T</span><span class="stat-value" style="color:var(--primary)">${s.total}</span></div>
                        <div class="stat-item" title="완료수"><span class="stat-label">D</span><span class="stat-value" style="color:var(--green)">${s.done}</span></div>
                        <div class="stat-item" title="누적시간"><span class="stat-label">⏱</span><span class="stat-value" style="color:var(--purple)">${fmt(s.mins)}</span></div>
                    </div>
                    <div class="proj-row-act">
                        <button onclick="editProject('${p.id}')">✏️</button>
                        <button onclick="deleteProject('${p.id}')" style="color:var(--red)">🗑</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function saveProject() {
            const name = document.getElementById('fName').value.trim();
            if (!name) return;
            const obj = { id: editId || ('P' + Date.now()), name, status: document.getElementById('fStatus').value, icon: document.getElementById('fIcon').value || '📁', memo: document.getElementById('fMemo').value.trim() };
            if (editId) { const i = projects.findIndex(p => p.id === editId); projects[i] = obj; } else projects.push(obj);
            await save(); renderList(); closeModal(); if (!editId) alert('등록되었습니다.');
        }

        function resetForm() { editId = null; document.getElementById('formTitle').textContent = '프로젝트 등록'; document.getElementById('fName').value = ''; document.getElementById('fStatus').value = 'active'; document.getElementById('fIcon').value = '📁'; document.getElementById('fMemo').value = ''; }

        window.editProject = id => {
            const p = projects.find(x => x.id === id); editId = id;
            document.getElementById('formTitle').textContent = '프로젝트 수정';
            document.getElementById('fName').value = p.name; document.getElementById('fStatus').value = p.status;
            document.getElementById('fIcon').value = p.icon || '📁'; document.getElementById('fMemo').value = p.memo || '';
            document.getElementById('modalOverlay').style.display = 'flex';
        };
        window.deleteProject = async id => {
            if (await TL_Confirm('삭제하시겠습니까?')) {
                projects = projects.filter(p => p.id !== id);
                await supabaseAPI.delete('projects', 'id', id);
                await save(); renderList();
            }
        };

        async function init(force = false) {
            try {
                const lp = await supabaseAPI.getTable('projects'); if (lp) projects = lp;
                const lt = await supabaseAPI.getTable('tasks'); if (lt) tasks = lt;
                const ll = await supabaseAPI.getTable('logs'); if (ll) logs = ll;
                renderList();
                if (force) await TL_Alert('동기화 완료');
            } catch (e) {
                console.error(e);
                if (force) alert('DB에서 데이터를 불러오지 못했습니다.\n' + (e.message || String(e)));
                renderList();
            }
        }
        init();
    </script>

    <!-- Custom Dialog -->
    <div id="cAlert"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div
            style="background:#1e2230; padding:24px; border-radius:12px; text-align:center; min-width:280px; max-width:400px; border:1px solid #333845;">
            <p id="cAlertMsg"
                style="margin-bottom:24px; font-size:15px; color:#f0f0f0; white-space:pre-wrap; line-height:1.5"></p>
            <div id="cAlertBtns" style="display:flex; gap:10px; justify-content:center"></div>
        </div>
    </div>
    <script>
        window.TL_Confirm = msg => new Promise(res => {
            document.getElementById('cAlertMsg').textContent = msg;
            document.getElementById('cAlertBtns').innerHTML = `<button onclick="closeC(false)" style="flex:1; padding:12px; background:#5c606e; color:#fff; border:none; border-radius:8px">취소</button><button onclick="closeC(true)" style="flex:1; padding:12px; background:#005fb8; color:#fff; border:none; border-radius:8px">확인</button>`;
            document.getElementById('cAlert').style.display = 'flex';
            window.closeC = v => { document.getElementById('cAlert').style.display = 'none'; res(v); };
        });
        window.TL_Alert = msg => new Promise(res => {
            document.getElementById('cAlertMsg').textContent = msg;
            document.getElementById('cAlertBtns').innerHTML = `<button onclick="closeA()" style="flex:1; padding:12px; background:#005fb8; color:#fff; border:none; border-radius:8px">확인</button>`;
            document.getElementById('cAlert').style.display = 'flex';
            window.closeA = () => { document.getElementById('cAlert').style.display = 'none'; res(true); };
        });
    </script>
    <script>
        function updateUIUser() {
            const badge = document.getElementById('userBadge');
            if (badge) badge.innerText = '👤 ' + supabaseAPI.currentUser;
        }

        function changeUser() {
            const newName = prompt('사용자 이름을 입력하세요:', supabaseAPI.currentUser);
            if (newName && newName.trim()) {
                supabaseAPI.currentUser = newName.trim();
                updateUIUser();
                location.reload();
            }
        }
        updateUIUser();
    </script>
</body>

</html>
