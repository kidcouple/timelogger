<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏢 고객사 관리 — Tacdore.TimeLogger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="supabaseClient.js"></script>
    <style>
        :root {
            --bg: #111318;
            --panel: #1c1f27;
            --border: #2a2d35;
            --primary: #4f8ef7;
            --green: #3fb950;
            --red: #f85149;
            --purple: #a371f7;
            --text: #e6edf3;
            --sub: #8b949e;
        }

        .user-badge {
            background: rgba(79, 142, 247, 0.15);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(79, 142, 247, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-badge:hover {
            background: rgba(79, 142, 247, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .back {
            color: var(--sub);
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: var(--text);
        }

        .title {
            font-size: 15px;
            font-weight: 700;
        }

        .toolbar {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        button {
            background: #2a2d35;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        button:hover {
            background: #353840;
        }

        button.primary {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }

        /* Desktop Header Nav */
        .desktop-nav {
            display: flex;
            gap: 20px;
            margin-left: 40px;
        }

        .desktop-nav a {
            color: var(--sub);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .desktop-nav a:hover,
        .desktop-nav a.active {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .desktop-nav {
                display: none;
            }
        }

        /* Tabs System */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .tab {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--sub);
            border-bottom: 2px solid transparent;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            color: var(--sub);
            cursor: pointer;
            transition: all 0.2s;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            background: rgba(79, 142, 247, 0.05);
            color: var(--text);
        }

        .content {
            padding: 24px 28px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* Modal / Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        .modal {
            background: #1c1f27;
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 450px;
            max-width: 95%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-head {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #232731;
            flex-wrap: nowrap;
            gap: 8px;
        }

        .badge {
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 700;
            min-width: 18px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .card-head {
                padding: 8px 12px;
                font-size: 13px;
                gap: 4px;
            }

            .card-head input {
                width: 100px !important;
                padding: 6px 10px !important;
                font-size: 12px !important;
            }

            .month-time {
                font-size: 10px !important;
                padding: 1px 6px !important;
            }
        }

        .card-body {
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label.fl {
            font-size: 11px;
            color: var(--sub);
            display: block;
            margin-bottom: 5px;
        }

        input.fi,
        textarea.fi {
            width: 100%;
            background: #111318;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        input.fi:focus,
        textarea.fi:focus {
            border-color: var(--primary);
            outline: none;
        }

        .client-list {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }

        .client-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            border-bottom: 1px solid #1e2028;
        }

        .client-row:hover {
            background: #1e2230;
        }

        .client-avatar {
            width: 38px;
            height: 38px;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f8ef7, #a371f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
            color: white;
        }

        .client-info {
            flex: 1;
            overflow: hidden;
        }

        .client-name {
            font-size: 14px;
            font-weight: 600;
        }

        .client-meta {
            font-size: 12px;
            color: var(--sub);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .client-stats {
            text-align: right;
            font-size: 12px;
            color: var(--sub);
            flex-shrink: 0;
        }

        .client-stats strong {
            display: block;
            color: var(--purple);
            font-size: 13px;
        }

        .act-btns {
            display: flex;
            gap: 4px;
        }

        .act-btns button {
            padding: 3px 8px;
            font-size: 11px;
        }

        .empty-list {
            text-align: center;
            padding: 40px;
            color: var(--sub);
            font-size: 13px;
        }

        @media (max-width: 768px) {
            body {
                padding-bottom: 70px;
            }

            header {
                padding: 12px 20px;
                background: var(--panel);
                position: sticky;
                top: 0;
                z-index: 100;
                border-bottom: 1px solid var(--border);
            }

            .back,
            .toolbar {
                display: none !important;
            }

            .mobile-action-bar {
                display: flex !important;
            }

            .content {
                display: flex;
                flex-direction: column-reverse;
                padding: 12px;
                gap: 15px;
            }

            .client-list {
                max-height: none;
            }

            .bottom-nav {
                display: flex !important;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 65px;
                background: #1c1f27;
                border-top: 1px solid var(--border);
                justify-content: space-around;
                align-items: center;
                z-index: 200;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .nav-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                color: var(--sub);
                text-decoration: none;
                font-size: 10px;
                opacity: 0.7;
            }

            .nav-item.active {
                color: var(--primary);
                opacity: 1;
            }

            .nav-icon {
                font-size: 20px;
            }
        }

        @media (min-width: 769px) {
            .bottom-nav {
                display: none !important;
            }
        }

        .icon-btn {
            font-size: 18px !important;
            padding: 6px 10px !important;
            line-height: 1 !important;
        }
    </style>
</head>

<body>
    <header>
        <a class="back" href="index.html">← 허브</a>
        <div class="title" style="display:flex; align-items:center; gap:8px">
            <a href="index.html" class="brand" style="font-size:20px; font-weight:800; letter-spacing:-0.3px; text-decoration:none; background:linear-gradient(90deg,#6c7bff,#a855f7); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;">Tacdore.TimeLogger</a>
            <div id="userBadge" class="user-badge" onclick="changeUser()">👤 로딩..</div>
        </div>

        <nav class="desktop-nav">
            <a href="index.html">할일목록</a>
            <a href="timer.html">타이머</a>
            <a href="clients.html" class="active">고객사</a>
            <a href="projects.html">프로젝트</a>
        </nav>

        <div class="toolbar">
            <button class="primary" onclick="openModal()">+ 고객사 등록</button>
            <button class="icon-btn" onclick="init(true)" title="최신 데이터 다시 불러오기 (새로고침)">🔄</button>
        </div>
    </header>

    <!-- Mobile Action Bar -->
    <div class="mobile-action-bar"
        style="display:none; padding:10px 16px; background:var(--bg); gap:8px; border-bottom:1px solid var(--border); justify-content: space-between; align-items:center;">
        <div class="title" style="font-size:14px">🏢 고객사</div>
        <div style="display:flex; gap:8px">
            <button class="primary" onclick="openModal()" style="padding:8px 12px">+ 등록</button>
            <button class="icon-btn" onclick="init(true)" style="background:var(--panel); padding:8px 12px">🔄</button>
        </div>
    </div>


    <div class="content">
        <div class="card">
            <div class="card-head">
                <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                    목록 <span id="cnt" class="badge">0</span>
                    <span id="totalMonthTime" class="month-time"
                        style="font-size:11px; font-weight:600; color:var(--primary); background:#111; padding:2px 8px; border-radius:10px; border:1px solid #333;">당월
                        0분</span>
                </div>
                <input
                    style="background:#111; border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:20px; font-size:13px; width:160px; outline:none;"
                    placeholder="🔍 검색..." oninput="renderList(this.value)">
            </div>
            <div class="client-list" id="clientList"></div>
        </div>
    </div>

    <!-- Registration / Edit Modal -->
    <div id="modalOverlay" class="overlay">
        <div class="modal">
            <div class="modal-head">
                <span id="formTitle">고객사 등록</span>
                <button onclick="closeModal()"
                    style="background:none; border:none; font-size:20px; color:var(--sub); cursor:pointer">&times;</button>
            </div>
            <div class="modal-body">
                <div><label class="fl">고객사명 *</label><input id="fName" class="fi" placeholder="예) (주)ABC"></div>
                <div><label class="fl">담당자</label><input id="fContact" class="fi" placeholder="홍길동"></div>
                <div><label class="fl">연락처</label><input id="fPhone" class="fi" placeholder="010-0000-0000"></div>
                <div><label class="fl">메모</label><textarea id="fMemo" class="fi" rows="3"
                        placeholder="추가 정보"></textarea></div>
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button onclick="closeModal()" style="flex:1">취소</button>
                    <button class="primary" onclick="saveClient()" style="flex:2">저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>할일목록</span>
        </a>
        <a href="timer.html" class="nav-item">
            <span class="nav-icon">⏱</span>
            <span>타이머</span>
        </a>
        <a href="clients.html" class="nav-item active">
            <span class="nav-icon">🏢</span>
            <span>고객사</span>
        </a>
        <a href="projects.html" class="nav-item">
            <span class="nav-icon">📁</span>
            <span>프로젝트</span>
        </a>
    </nav>

    <script>
        let clients = [];
        let tasks = [];
        let logs = [];
        let editId = null;

        async function save() {
            try {
                await supabaseAPI.upsert('clients', clients);
            } catch (e) {
                console.error("DB Save failed:", e);
            }
        }

        function openModal() {
            resetForm();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function getMonthKey(dateInput, fallback = false) {
            if (!dateInput) {
                if (fallback) {
                    const d = new Date();
                    return d.getFullYear() + '-' + d.getMonth();
                }
                return null;
            }
            let dStr = dateInput;
            if (typeof dateInput === 'string' && dateInput.includes('.')) {
                dStr = dateInput.replace(/\.\s*/g, '-').replace(/-$/, '');
            }
            const d = new Date(dStr);
            if (isNaN(d.getTime())) {
                if (fallback) {
                    const now = new Date();
                    return now.getFullYear() + '-' + now.getMonth();
                }
                return null;
            }
            return d.getFullYear() + '-' + d.getMonth();
        }

        function clientTime(name) {
            let totalMins = 0;
            let monthMins = 0;
            const now = new Date();
            const currentMonthKey = now.getFullYear() + '-' + now.getMonth();

            const clientTasks = tasks.filter(t => t.client && t.client.trim().toLowerCase() === name.trim().toLowerCase());
            clientTasks.forEach(t => {
                if (t.actualTime !== null && t.actualTime !== undefined && t.actualTime !== '' && parseFloat(t.actualTime) > 0) {
                    const m = parseFloat(t.actualTime);
                    totalMins += m;
                    if (getMonthKey(t.aStart || t.reqDate, true) === currentMonthKey) {
                        monthMins += m;
                    }
                }

                const tid = String(t.id || '');
                const tseq = t.seq ? String(t.seq) : '';
                (logs || []).forEach(l => {
                    const ltid = String(l.taskId || '');
                    if (ltid && (ltid === tid || (tseq && ltid === tseq))) {
                        let duration = 0;
                        let logDate = null;
                        if (l.duration) {
                            duration = parseFloat(l.duration) || 0;
                            logDate = l.end || l.start;
                        }
                        else if (l.start && l.end) {
                            duration = (new Date(l.end) - new Date(l.start)) / 60000;
                            logDate = l.end;
                        }

                        if (duration > 0) {
                            totalMins += duration;
                            if (getMonthKey(logDate) === currentMonthKey) {
                                monthMins += duration;
                            }
                        }
                    }
                });
            });
            return { totalMins, monthMins };
        }

        const fmt = m => {
            if (isNaN(m) || m === 0) return '0분';
            const h = Math.floor(m / 60);
            const min = Math.round(m % 60);
            if (h > 0) return `${h}시간 ${min}분`;
            return `${min}분`;
        };

        function renderList(q = '') {
            const el = document.getElementById('clientList');

            // 검색어에 따른 필터링 (대소문자 무시)
            const query = q.toLowerCase();
            const list = query ? clients.filter(c =>
                (c.name && c.name.toLowerCase().includes(query)) ||
                (c.memo && c.memo.toLowerCase().includes(query)) ||
                (c.contact && c.contact.toLowerCase().includes(query))
            ) : clients;

            document.getElementById('cnt').textContent = list.length;

            if (!list.length) {
                el.innerHTML = `<div class="empty-list">등록된 고객사가 없습니다.<br>${q ? '검색 결과를 찾을 수 없습니다.' : '상단의 [+ 고객사 등록] 버튼을 눌러 추가하세요.'}</div>`;
                const tm = document.getElementById('totalMonthTime');
                if (tm) tm.textContent = '당월 0h 0m';
                return;
            }

            let sumMonthMins = 0;
            const clientData = list.map(c => {
                const times = clientTime(c.name);
                const mm = Math.round(times.monthMins || 0);
                sumMonthMins += mm;
                return {
                    ...c,
                    totalMins: Math.round(times.totalMins || 0),
                    monthMins: mm,
                    taskCnt: tasks.filter(t => t.client && t.client.trim().toLowerCase() === c.name.trim().toLowerCase()).length
                };
            });

            const tmNode = document.getElementById('totalMonthTime');
            if (tmNode) tmNode.textContent = `당월 ${fmt(sumMonthMins)}`;

            clientData.sort((a, b) => {
                if (b.monthMins !== a.monthMins) {
                    return b.monthMins - a.monthMins;
                }
                return b.totalMins - a.totalMins;
            });

            el.innerHTML = clientData.map(c => {
                // 아바타 이니셜 안전하게 추출
                let initials = '??';
                if (c.name) {
                    const cleanName = c.name.replace(/[^\w가-힣]/g, '');
                    initials = cleanName.length > 0 ? cleanName.slice(0, 2) : c.name.slice(0, 2);
                }

                // 메타 정보 조립
                let metaInfo = [];
                if (c.contact) metaInfo.push(c.contact);
                if (c.phone) metaInfo.push(c.phone);
                let metaStr = metaInfo.join(' · ');
                if (c.memo) metaStr += (metaStr ? ' | ' : '') + c.memo;

                return `<div class="client-row">
                  <div class="client-avatar">${initials}</div>
                  <div class="client-info">
                    <div class="client-name">${c.name || '이름 없음'}</div>
                    <div class="client-meta" title="${metaStr}">${metaStr}</div>
                  </div>
                  <div class="client-stats" style="display:flex; justify-content:flex-end; gap:24px; align-items:center;">
                    <div style="text-align:right">
                      <div style="font-size:11px; color:var(--sub); margin-bottom:2px;">당월시간</div>
                      <div style="font-size:13px; font-weight:700; color:var(--primary);">${fmt(c.monthMins)}</div>
                    </div>
                    <div style="text-align:right; min-width:70px;">
                      <div style="font-size:11px; color:var(--sub); margin-bottom:2px;">총 누적시간</div>
                      <div style="font-size:13px; font-weight:600; color:#ddd;">${fmt(c.totalMins)}</div>
                      <div style="font-size:10px; color:#888;">${c.taskCnt}건</div>
                    </div>
                  </div>
                  <div class="act-btns">
                    <button onclick="event.stopPropagation(); editClient('${c.id}')" title="수정">✏️</button>
                    <button onclick="event.stopPropagation(); deleteClient('${c.id}')" style="color:var(--red)" title="삭제">🗑</button>
                  </div>
                </div>`;
            }).join('');
        }

        async function saveClient() {
            const name = document.getElementById('fName').value.trim();
            if (!name) { alert('고객사명은 필수입니다.'); return; }

            const obj = {
                id: editId || ('C' + Date.now()),
                name,
                contact: document.getElementById('fContact').value.trim(),
                phone: document.getElementById('fPhone').value.trim(),
                memo: document.getElementById('fMemo').value.trim()
            };

            if (editId) {
                const i = clients.findIndex(c => c.id === editId);
                if (i !== -1) clients[i] = obj;
            } else {
                clients.push(obj);
            }

            await save();
            renderList();
            closeModal();
            if (!editId) alert('고객사가 등록되었습니다.');
        }

        function resetForm() {
            editId = null;
            document.getElementById('formTitle').textContent = '데이터 등록';

            ['fName', 'fContact', 'fPhone', 'fMemo'].forEach(id => document.getElementById(id).value = '');
        }



        function editClient(id) {
            const c = clients.find(x => x.id === id);
            if (!c) return;

            editId = id;
            document.getElementById('formTitle').textContent = '고객사 수정';
            document.getElementById('fName').value = c.name || '';
            document.getElementById('fContact').value = c.contact || '';
            document.getElementById('fPhone').value = c.phone || '';
            document.getElementById('fMemo').value = c.memo || '';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        async function deleteClient(id) {
            if (await TL_Confirm('삭제하시겠습니까? 관련 업무 데이터는 유지되지만 고객사 연결이 끊어질 수 있습니다.')) {
                clients = clients.filter(c => c.id !== id);
                await supabaseAPI.delete('clients', 'id', id);
                await save();
                renderList();
            }
        }






        async function init(force = false) {
            try {
                const loadedClients = await supabaseAPI.getTable('clients');
                if (loadedClients) clients = loadedClients;

                const loadedTasks = await supabaseAPI.getTable('tasks');
                if (loadedTasks) tasks = loadedTasks;

                const loadedLogs = await supabaseAPI.getTable('logs');
                if (loadedLogs) logs = loadedLogs;

                renderList();
                if (force) await TL_Alert('최신 데이터를 정상적으로 불러왔습니다.');
            } catch (e) {
                console.error('Auto-load failed:', e);
                if (force) alert('DB에서 데이터를 불러오지 못했습니다.\n' + e.message);
            }
            renderList();
        }
        init();

        // Helper for CSV parsing in auto-load
        function parseLine(str) {
            let res = [], cur = '', inQuote = false;
            for (let i = 0; i < str.length; i++) {
                let c = str[i];
                if (c === '"' && str[i + 1] === '"') { cur += '"'; i++; }
                else if (c === '"') { inQuote = !inQuote; }
                else if (c === ',' && !inQuote) { res.push(cur.trim()); cur = ''; }
                else { cur += c; }
            }
            res.push(cur.trim());
            return res;
        }
    </script>

    <!-- Custom Confirm/Alert Dialog -->
    <div id="cAlert"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; justify-content:center; align-items:center;">
        <div
            style="background:#1e2230; padding:24px; border-radius:12px; text-align:center; min-width:280px; max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.6); border:1px solid #333845;">
            <p id="cAlertMsg"
                style="margin-bottom:24px; font-size:15px; color:#f0f0f0; white-space:pre-wrap; line-height:1.5"></p>
            <div id="cAlertBtns" style="display:flex; gap:10px; justify-content:center"></div>
        </div>
    </div>
    <script>
        window.TL_Confirm = function (msg) {
            return new Promise(resolve => {
                document.getElementById('cAlertMsg').textContent = msg;
                const btns = document.getElementById('cAlertBtns');
                btns.innerHTML = `
            <button id="cAlertNo" style="flex:1; padding:12px; border-radius:8px; font-weight:bold; background:#5c606e; color:#fff; border:none; cursor:pointer">취소</button>
            <button id="cAlertYes" style="flex:1; padding:12px; border-radius:8px; font-weight:bold; background:#005fb8; color:#fff; border:none; cursor:pointer">확인</button>
        `;
                document.getElementById('cAlert').style.display = 'flex';

                document.getElementById('cAlertNo').onclick = () => { document.getElementById('cAlert').style.display = 'none'; resolve(false); };
                document.getElementById('cAlertYes').onclick = () => { document.getElementById('cAlert').style.display = 'none'; resolve(true); };
            });
        };
        window.TL_Alert = function (msg) {
            return new Promise(resolve => {
                document.getElementById('cAlertMsg').textContent = msg;
                const btns = document.getElementById('cAlertBtns');
                btns.innerHTML = `<button id="cAlertOk" style="flex:1; padding:12px; border-radius:8px; font-weight:bold; background:#005fb8; color:#fff; border:none; cursor:pointer">확인</button>`;
                document.getElementById('cAlert').style.display = 'flex';

                document.getElementById('cAlertOk').onclick = () => { document.getElementById('cAlert').style.display = 'none'; resolve(true); };
            });
        };
    </script>
    <script>
        function updateUIUser() {
            const badge = document.getElementById('userBadge');
            if (badge) badge.innerText = '👤 ' + supabaseAPI.currentUser;
        }

        function changeUser() {
            const newName = prompt('사용자 이름을 입력하세요:', supabaseAPI.currentUser);
            if (newName && newName.trim()) {
                supabaseAPI.currentUser = newName.trim();
                updateUIUser();
                location.reload();
            }
        }
        updateUIUser();
    </script>
